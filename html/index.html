<!DOCTYPE html>
<html>
  <script src="/main.js"></script>
  <script src="/main_info.js"></script>
  <script src="/i18n.js"></script>
  <script>
  window.addEventListener("load", function () {
    /* v3-initial-load-retry */
    var AUTO_MS = 2000;
    var timer = null;
    var tries = 0;
    var btn = document.getElementById("auto-refresh-btn");
    var label = document.getElementById("auto-refresh-label");

    function setAuto(on) {
      if (on && !timer) {
        timer = setInterval(update, AUTO_MS);
      } else if (!on && timer) {
        clearInterval(timer);
        timer = null;
      }
      if (btn) {
        if (timer) {
          btn.classList.add("on");
        } else {
          btn.classList.remove("on");
        }
      }
      if (label) {
        if (timer) {
          label.setAttribute("data-i18n", "dash_auto_refresh");
        } else {
          label.setAttribute("data-i18n", "dash_refresh");
        }
        if (typeof translateAll === "function") {
          translateAll();
        }
      }
    }

    /* v3-svg-ready */
    function haveData() {
      if (typeof numPorts === "undefined" || numPorts <= 0) {
        return false;
      }
      var found = 0;
      var ready = 0;
      for (var i = 1; i <= numPorts; i++) {
        var el = document.getElementById("port" + i);
        if (el) {
          found = found + 1;
          if (el.contentDocument) {
            ready = ready + 1;
          }
        }
      }
      return found > 0 && ready === found;
    }

    function initialLoad() {
      update(function () {
        if (typeof updateTiles === "function") {
          updateTiles();
        }
        if (haveData()) {
          setAuto(false);
          return;
        }
        tries = tries + 1;
        if (tries < 15) {
          setTimeout(initialLoad, 400);
        } else {
          setAuto(false);
        }
      });
    }

    if (btn) {
      btn.onclick = function () {
        var wasOn = (timer !== null);
        setAuto(!wasOn);
        if (wasOn) {
          update(function () {
            if (typeof updateTiles === "function") {
              updateTiles();
            }
            if (typeof window.refreshInfoTable === "function") {
              window.refreshInfoTable();
            }
          });
        }
      };
    }

    /* v5-direct-refresh: 等全部资源就绪后再刷一次, 确保速率有值 */
    function finalRefresh() {
      update(function () {
        if (typeof updateTiles === "function") {
          updateTiles();
        }
        if (typeof window.refreshInfoTable === "function") {
          window.refreshInfoTable();
        }
      });
    }

    setTimeout(finalRefresh, 400);
    setTimeout(finalRefresh, 1500);

    setAuto(false);
    initialLoad();
  });
  </script>
  <link rel="stylesheet" href="style.css">
  <title data-i18n="index_title">FreeSwitchOS Main Page</title>
</head>

<body>
  <nav id="sidebar"></nav>
  <div style="margin-left:16%;padding:1px 16px;height:1000px;">
    <div class="page-head">
      <h1 data-i18n="index_heading">Switch Configuration</h1>
      <button type="button" id="auto-refresh-btn" class="refresh-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        <span id="auto-refresh-label" data-i18n="dash_refresh">刷新</span>
      </button>
    </div>
    <div class="tiles">
      <div class="tile">
        <div class="tile-icon tile-accent-a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
        <div class="tile-value" id="tile-ports">–</div>
        <div class="tile-label" data-i18n="dash_ports">Ports</div>
      </div>
      <div class="tile">
        <div class="tile-icon tile-accent-b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l3.5-5"/></svg></div>
        <div class="tile-value" id="tile-speed">–</div>
        <div class="tile-label" data-i18n="dash_speed">Max Link Speed</div>
      </div>
      <div class="tile">
        <div class="tile-icon tile-accent-c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5"/><path d="m6 11 6-6 6 6"/></svg></div>
        <div class="tile-value" id="tile-tx">–</div>
        <div class="tile-label" data-i18n="dash_tx">TX Total</div>
      </div>
      <div class="tile">
        <div class="tile-icon tile-accent-d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15"/><path d="m6 13 6 6 6-6"/></svg></div>
        <div class="tile-value" id="tile-rx">–</div>
        <div class="tile-label" data-i18n="dash_rx">RX Total</div>
      </div>
    </div>
    <div id="ports"></div>
    <table id="infoTable">
      <tr>
        <th colspan="2" data-i18n="index_settings">Settings</th>
      </tr>
      <tbody>
      </tbody>
    </table>
  </div>
  <script src="/dashboard.js"></script>
  <script src="/navigation.js"></script>
  <script>if (typeof translateAll === "function") translateAll();</script>
</body>
</html>
