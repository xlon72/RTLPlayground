name: Build firmware

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev git -y

      - name: Show toolchain versions
        run: |
          echo "sdcc: $(sdcc --version 2>&1 | head -2 | tr '\n' ' ')"
          echo "gcc:  $(gcc --version | head -1)"
          echo "make: $(make --version | head -1)"

      - name: Check machine definitions
        run: make machine_check

      - name: Build firmware
        run: make MACHINE="FG_4GT_2SX_V2_0"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-FG_4GT_2SX_V2_0
          path: output/**/*.bin
          retention-days: 90
